[project]
name = "engineering-orchestrator"
version = "0.1.1"
description = "Local-model task controller for coding agents"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fire>=0.7.1",
]

[project.urls]
Repository = "https://github.com/jcsduncan/engineering-orchestrator"
Documentation = "https://jcsduncan.github.io/engineering-orchestrator/"

[project.scripts]
engineer = "engineer.cli:main"
engineer-issues = "engineer.intake_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--cov=engineer", "--cov-report=term-missing"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["engineer"]
branch = true

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

