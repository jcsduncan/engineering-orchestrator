name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release-app-token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.release-app-token.outputs.token || github.token }}
      - name: Auto-merge release PR
        if: ${{ steps.release-app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open \
            --json number,headRefName,headRefOid,title \
            | jq -c '[.[] | select(.headRefName == "release-please--branches--main--components--engineering-orchestrator")][0] // empty')
          if [ -z "$pr" ]; then
            exit 0
          fi
          number=$(jq -r '.number' <<< "$pr")
          head_sha=$(jq -r '.headRefOid' <<< "$pr")
          title=$(jq -r '.title' <<< "$pr")
          subject="${title#*: }"
          subject="${subject^}"
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --subject "$subject" --body "" --match-head-commit "$head_sha"

  image:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
