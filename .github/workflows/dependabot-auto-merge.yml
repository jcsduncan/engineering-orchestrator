name: Dependabot auto-merge

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Trusted Dependabot PR metadata only; no PR checkout or code execution.
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  auto-merge:
    if: >-
      github.repository == 'jcsduncan/engineering-orchestrator' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for development dependency patches
        if: >-
          steps.metadata.outputs.package-ecosystem == 'uv' &&
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          subject="${PR_TITLE#*: }"
          gh pr merge "$PR_URL" --auto --squash --subject "$subject" --body "" --match-head-commit "$PR_HEAD"
